<meta name="viewport" content="width=device-width,initial-scale=1"><title>تنمية الموارد</title>
<link rel="stylesheet" href="style.css"></head><body><header></header><main>

<h2>١. السياسات والمستهدفات</h2>
<div class="card"><b>سياسات اللجنة (قائمة مراجعة للمشاركة والاعتماد)</b><div id="pol"></div></div>
<h3>مستهدفات اللجنة</h3><div id="tg"></div>
<h2>٢. نماذج تنمية الموارد (أسئلة)</h2>
<p class="muted">كل نموذج محوّل إلى أسئلة تُجاب عند التواصل مع الجهة المانحة أو الواقفة. الإجابات تُحفظ تلقائياً.</p><div id="qs"></div>
</main><footer>البيانات تُحفظ في هذا المتصفح فقط · استخدم «تصدير CSV» لمشاركتها</footer>
<script src="app.js"></script><script>nav('resources.html');
checklist(document.getElementById("pol"),"pol",["مشاركة سياسات تنمية الموارد مع أعضاء اللجنة","اعتماد سياسة قبول التبرعات والأوقاف","اعتماد سياسة الشراكات والعقود","اعتماد سياسة التسويق والتواصل مع الداعمين","إنشاء لجنة تنمية الموارد واعتماد مهامها وأعضائها"]);
editableTable(document.getElementById("tg"),"targets",[{key:"t",label:"المستهدف",type:"area"},{key:"i",label:"المؤشر"},{key:"b",label:"الوضع الحالي"},{key:"g",label:"المستهدف الرقمي"},{key:"o",label:"المسؤول"},{key:"d",label:"الموعد",type:"date"},{key:"s",label:"الحالة",type:"select",options:["لم يبدأ","جارٍ","منجز","متأخر"]}],[{}]);
const Q=document.getElementById("qs");
questionForm(Q,"q-donor","نموذج الداعم / المتبرع",[{q:"ما اسم الجهة أو الشخص، وما صفته (فرد، شركة، وقف، جهة حكومية)؟"},{q:"ما مجال الدعم الذي يهمه (طلاب، معلمون، مبانٍ، برامج، تقنية)؟"},{q:"ما نوع الدعم المتوقع (نقدي، عيني، وقفي، رعاية، تطوع)؟"},{q:"ما حجم الدعم أو الفترة الزمنية المتوقعة؟"},{q:"ما المخرجات والتقارير التي يريدها لمتابعة أثر دعمه؟"},{q:"هل لديه شروط أو متطلبات خاصة (تسمية، توثيق، صرف على مراحل)؟"},{q:"من جهة الاتصال لدينا، وما الخطوة التالية وموعدها؟"}]);
questionForm(Q,"q-project","نموذج مشروع قابل للتمويل",[{q:"ما اسم المشروع وهدفه؟"},{q:"من الفئة المستفيدة وكم عددها؟"},{q:"ما الميزانية الإجمالية وما بنودها؟"},{q:"ما المدة الزمنية ومراحل التنفيذ؟"},{q:"ما مؤشرات قياس النجاح؟"},{q:"ما مخاطر المشروع وكيف نعالجها؟"},{q:"ما الجزء الممول حالياً وما المتبقي؟"}]);
questionForm(Q,"q-waqf","نموذج الوقف / الشراكة",[{q:"ما طبيعة الشراكة أو الوقف (ريع، منحة، مشاركة في التنفيذ)؟"},{q:"من الجهة المقابلة وما صلاحية من يمثلها؟"},{q:"ما الالتزامات على المشكاة وما الالتزامات على الشريك؟"},{q:"ما مدة العقد وآلية التجديد؟"},{q:"كيف تُتابَع الالتزامات ومن يتابعها؟"}]);</script></body></html>
